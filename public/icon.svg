<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1215" />
      <stop offset="50%" stop-color="#111a1e" />
      <stop offset="100%" stop-color="#162227" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Carbon Pattern Effect -->
    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Background Squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="108" fill="none" stroke="url(#cyanGrad)" stroke-width="8" opacity="0.6" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGlow)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.75" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="130" fill="#0f191e" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Play Symbol (Neon Cyan & Gold) -->
  <polygon points="220,175 340,256 220,337" fill="url(#cyanGrad)" filter="drop-shadow(0 0 12px rgba(0, 240, 255, 0.8))" />
  
  <!-- Lightning Bolt Overlay -->
  <path d="M265 140 L220 250 L260 250 L235 365 L310 235 L265 235 Z" fill="url(#goldGrad)" opacity="0.9" filter="drop-shadow(0 0 10px rgba(212, 175, 55, 0.7))" />

  <!-- Brand Text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    TEGUH STREAM
  </text>
</svg>
